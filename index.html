<style>
    :root {
        --bg-main: #0e0303;
        --bg-gradient-start: #1c0606;
        --bg-gradient-end: #030101;
        --bg-panel: #200808;
        --accent-burgundy: #8B1A1A;
        --accent-gold: #D4AF37;
        --light-gold: #F0CC5A;
        --text-main: #F5E6C8;
        --text-secondary: #C9A96E;
        --text-muted: #7a5c3a;
        --border-gold: rgba(212, 175, 55, 0.15);
        --font-headers: 'Cinzel', serif;
        --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100%;
    }

    body {
        background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
        color: var(--text-main);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .panel {
        max-width: 480px;
        width: 100%;
        background: var(--bg-panel);
        border: 1px solid var(--border-gold);
        border-radius: 6px;
        padding: 48px 36px;
        text-align: center;
        position: relative;
    }

    .panel::before {
        content: '';
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(212, 175, 55, 0.08);
        border-radius: 4px;
        pointer-events: none;
    }

    h1 {
        font-family: var(--font-headers);
        font-weight: 700;
        font-size: 1.6rem;
        color: var(--light-gold);
        text-shadow: 0 0 10px rgba(240, 204, 90, 0.4);
        margin-bottom: 16px;
        letter-spacing: 0.5px;
    }

    p {
        color: var(--text-secondary);
        line-height: 1.6;
        font-size: 0.95rem;
        margin-bottom: 32px;
    }

    a.btn {
        display: inline-block;
        font-family: var(--font-headers);
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.5px;
        padding: 14px 32px;
        background: var(--accent-burgundy);
        color: var(--light-gold);
        text-decoration: none;
        border: 1px solid var(--border-gold);
        border-radius: 4px;
        transition: all .2s ease;
    }

    a.btn:hover {
        background: var(--accent-gold);
        color: var(--bg-main);
        box-shadow: 0 0 16px rgba(212, 175, 55, 0.5);
    }

    .link-fallback {
        margin-top: 20px;
        font-size: 0.78rem;
        color: var(--text-muted);
        word-break: break-all;
    }
</style>
</head>
<body>

  </div>
</body>
